<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - College Event Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🎓 College Event Portal</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="schedule.html">Schedule</a>
        <a href="gallery.html">Gallery</a>
        <a href="registration.html">Registration</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <h2 class="page-title">📝 Event Registration</h2>

    <form id="registrationForm">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number"
                   pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
            <label for="department">Department</label>

            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option value="ECE">ECE</option>
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">Mechanical</option>
                <option value="CIVIL">Civil</option>
                <option value="IT">Information Technology</option>
            </select>
        </div>

        <div class="form-group">
            <label for="event">Select Event</label>

            <select id="event" name="event" required>
                <option value="">Select Event</option>
                <option value="Coding Competition">
                    Coding Competition
                </option>
                <option value="Cultural Fest">
                    Cultural Fest
                </option>
                <option value="Sports Meet">
                    Sports Meet
                </option>
                <option value="Technical Workshop">
                    Technical Workshop
                </option>
                <option value="Photography Contest">
                    Photography Contest
                </option>
                <option value="Quiz Competition">
                    Quiz Competition
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">Message</label>

            <textarea id="message" name="message"
                      placeholder="Enter any additional message"></textarea>
        </div>

        <button type="submit" class="btn">
            Submit Registration
        </button>

    </form>

</main>

<footer>
    <p>© 2026 College Event Portal | All Rights Reserved</p>
</footer>

<script src="script.js"></script>

</body>
</html>
